<svg xmlns="http://www.w3.org/2000/svg" width="467" height="195"
     viewBox="0 0 467 195" role="img"
     aria-label="Perkakas: PHP · JavaScript · Python · Bash · SQL, Laravel 13 · Livewire 4 · Tailwind 4 · Vite, MariaDB · SQLite · Linux · nginx · Docker, nmap · ffuf · sqlmap · NetExec · Sliver">
  <style>
      .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
      .label  { font: 400 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
      .nilai  { font: 600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
      .baris  { opacity: 0; animation: masuk .5s ease-in-out forwards; }
      @keyframes masuk { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
