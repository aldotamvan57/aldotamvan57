  <g class="baris" style="animation-delay:0.27s"><text class="label" x="28" y="108">Framework</text><text class="nilai" x="128" y="108">Laravel 13 · Livewire 4 · Tailwind 4 · Vite</text></g>
  <g class="baris" style="animation-delay:0.39s"><text class="label" x="28" y="138">Data &amp; sistem</text><text class="nilai" x="128" y="138">MariaDB · SQLite · Linux · nginx · Docker</text></g>
  <g class="baris" style="animation-delay:0.51s"><text class="label" x="28" y="168">Redteam</text><text class="nilai" x="128" y="168">nmap · ffuf · sqlmap · NetExec · Sliver</text></g>
